name: publish-images

# Build & push the epoch.me service images to the DigitalOcean Container Registry.
# arm64-only, built on GitHub's NATIVE arm64 runner (ubuntu-24.04-arm, free for
# public repos) so there is NO QEMU emulation — the Rust viz build runs at native
# speed (~10 min) instead of 1h+ under emulation. eevee (the only consumer) is
# arm64; the DO droplet (amd64) is decommissioned, so amd64 images aren't needed.
# To re-add amd64 later: add a second job on ubuntu-latest + a manifest-merge job.
#
# Requires repo secret: DIGITALOCEAN_TOKEN (used for DO CR docker login).

on:
  push:
    branches: [main]
    paths:
      - 'viz/**'
      - 'telegram_bot/**'
      - 'backup/**'
      - 'collector/**'
      - '.github/workflows/publish.yaml'
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com/pokedesk-cr

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: epoch-viz
            context: viz
          - name: epoch-telegram
            context: telegram_bot
          - name: epoch-backup
            context: backup
          - name: epoch-whoop
            context: collector/whoop
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DIGITALOCEAN_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_TOKEN }}
      - name: Build & push ${{ matrix.name }} (arm64, native)
        uses: docker/build-push-action@v5
        with:
          context: "{{defaultContext}}:${{ matrix.context }}"
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
